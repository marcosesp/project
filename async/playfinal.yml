---
- name: DNF update con monitoreo en tiempo real
  hosts: all
  become: true

  vars:
    dnf_log: /tmp/dnf-update.log
    dnf_offset: /tmp/dnf-update.offset

  tasks:

    - name: Limpiar archivos anteriores
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ dnf_log }}"
        - "{{ dnf_offset }}"

    - name: Inicializar offset
      ansible.builtin.copy:
        content: "1"
        dest: "{{ dnf_offset }}"
        mode: "0644"

    - name: Iniciar DNF update en segundo plano
      ansible.builtin.shell: |
        stdbuf -oL -eL dnf -y update > {{ dnf_log }} 2>&1
      async: 10800
      poll: 0
      register: dnf_job

    - name: Monitorear proceso DNF
      ansible.builtin.include_tasks:
        file: monitor_dnf.yml
      loop: "{{ range(1, 10801) | list }}"
      loop_control:
        loop_var: monitor_iteration
